<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Wee Tarot — text wrap QA</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        touch-action: none;
      }

      #app {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 400px;
        gap: 10px;
      }

      #qa-banner {
        width: 100%;
        color: #f2c744;
        font-family: "Courier New", Courier, monospace;
        font-size: 12px;
        letter-spacing: 0.04em;
        text-align: center;
      }

      #qa-meta {
        width: 100%;
        min-height: 32px;
        color: #a9aaad;
        font-family: "Courier New", Courier, monospace;
        font-size: 12px;
        line-height: 1.35;
        text-align: center;
        word-break: break-word;
      }

      #qa-meta.is-overflow {
        color: #ff6b6b;
      }

      #game {
        width: 400px;
        height: 240px;
        line-height: 0;
      }

      #game canvas {
        width: 400px !important;
        height: 240px !important;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        box-shadow: 0 0 0 4px #f2c744;
      }

      #chrome {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        align-items: center;
        width: 100%;
        min-height: 56px;
        user-select: none;
        -webkit-user-select: none;
      }

      #chrome button {
        appearance: none;
        border: 2px solid #f2c744;
        background: #1a1a1a;
        color: #f2c744;
        font-family: "Courier New", Courier, monospace;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.04em;
        height: 44px;
        cursor: pointer;
        touch-action: manipulation;
      }

      #chrome button:disabled {
        opacity: 0.35;
        cursor: default;
      }

      #chrome button:not(:disabled):active {
        background: #f2c744;
        color: #1a1a1a;
      }

      #btn-back {
        justify-self: start;
        grid-column: 1;
      }

      #btn-confirm {
        justify-self: end;
        grid-column: 3;
      }

      #btn-back,
      #btn-confirm {
        min-width: 56px;
        width: auto;
        padding: 0 12px;
        border-radius: 999px;
        font-size: 13px;
        line-height: 1;
      }

      #btn-back.is-hidden,
      #btn-confirm.is-hidden,
      #btn-middle {
        display: none;
      }

      #chrome-nav {
        grid-column: 2;
        justify-self: center;
        display: none;
        align-items: center;
        gap: 10px;
      }

      #chrome-nav.is-visible {
        display: flex;
      }

      #btn-up,
      #btn-down {
        min-width: 56px;
        width: 56px;
        padding: 0;
        border-radius: 50%;
        font-size: 18px;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <div id="qa-banner">Debug only — not in the game. Next/Prev lines, Up/Down groups.</div>
        <div id="game"></div>
        <div id="qa-meta">Loading…</div>
        <div id="chrome" aria-label="QA controls">
          <button type="button" id="btn-back" class="is-hidden" disabled aria-label="Previous">Prev</button>
          <button type="button" id="btn-middle" class="is-hidden" disabled>Shuffle</button>
          <div id="chrome-nav" aria-label="Jump group">
            <button type="button" id="btn-up" disabled aria-label="Previous group">▲</button>
            <button type="button" id="btn-down" disabled aria-label="Next group">▼</button>
          </div>
          <button type="button" id="btn-confirm" class="is-hidden" disabled aria-label="Next">Next</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/debug/main.ts"></script>
  </body>
</html>
