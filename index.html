<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Wee Tarot</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        touch-action: none;
      }

      /* Full-viewport centering shell. Also the size reference for integer zoom. */
      #app {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }

      #game {
        line-height: 0;
      }

      #game canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        /* Yellow frame around the screen. box-shadow spread stays a constant
           thickness and does not affect canvas sizing/scaling. */
        box-shadow: 0 0 0 4px #f2c744;
      }

      #chrome {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        min-height: 56px;
        user-select: none;
        -webkit-user-select: none;
      }

      #chrome button {
        appearance: none;
        border: 2px solid #f2c744;
        background: #1a1a1a;
        color: #f2c744;
        font-family: "Courier New", Courier, monospace;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.04em;
        min-width: 88px;
        height: 44px;
        padding: 0 18px;
        border-radius: 999px;
        cursor: pointer;
        touch-action: manipulation;
      }

      #chrome button:disabled {
        opacity: 0.35;
        cursor: default;
      }

      #chrome button:not(:disabled):active {
        background: #f2c744;
        color: #1a1a1a;
      }

      #btn-a {
        min-width: 56px;
        width: 56px;
        padding: 0;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <div id="game"></div>
        <div id="chrome" aria-label="Game controls">
          <button type="button" id="btn-shuffle" disabled>Shuffle</button>
          <button type="button" id="btn-a" disabled aria-label="A button">A</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
