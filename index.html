<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Wee Tarot</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      /* Full-viewport centering box. Also the size reference for integer zoom. */
      #game {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #game canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        /* Yellow frame around the screen. box-shadow spread stays a constant
           thickness and does not affect canvas sizing/scaling. */
        box-shadow: 0 0 0 4px #f2c744;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
